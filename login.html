<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Digital Evidence Binder</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .login-container{
            max-width:600px;
            margin:80px auto;
        }

        .login-card{
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 3px 15px rgba(0,0,0,.08);
            text-align:center;
        }

        .login-card h1{
            color:var(--blue);
            margin-bottom:15px;
        }

        .login-card p{
            margin-bottom:30px;
            color:#555;
        }

        .login-buttons{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .continue-btn{
            background:var(--blue);
            color:white;
            text-decoration:none;
            padding:14px;
            border-radius:8px;
            font-weight:600;
        }

        .google-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;

            padding:14px;

            border:none;
            border-radius:8px;

            background:#e0e0e0;
            color:#777;

            font-weight:600;

            cursor:not-allowed;
        }

        .google-btn svg{
            width:22px;
            height:22px;
        }

        .coming-soon{
            margin-top:15px;
            color:#777;
            font-size:.9rem;
        }

    </style>

</head>

<body>

<header>

    <div class="container header-container">

        <div class="logo">

            <img src="logo.gif" alt="Logo">

            <div class="logo-text">
                <h2>Digital Evidence Binder</h2>
                <p>Case Documentation Portal</p>
            </div>

        </div>

    </div>

</header>

<main class="container">

    <div class="login-container">

        <div class="login-card">

            <h1>Access Portal</h1>

            <p>
                Choose how you would like to continue.
            </p>

            <div class="login-buttons">

                <a href="index.html" class="continue-btn">
                    Continue Without Signing In
                </a>

                <button class="google-btn" disabled>

                    <svg viewBox="0 0 48 48">

                        <path fill="#EA4335"
                        d="M24 9.5c3.54 0 6.73 1.22 9.24 3.6l6.9-6.9C35.95 2.53 30.43 0 24 0 14.62 0 6.51 5.38 2.56 13.22l8.04 6.24C12.46 13.49 17.74 9.5 24 9.5z"/>

                        <path fill="#4285F4"
                        d="M46.5 24.55c0-1.64-.15-3.21-.43-4.73H24v8.95h12.66c-.55 2.95-2.21 5.46-4.71 7.15l7.26 5.64C43.91 37.14 46.5 31.4 46.5 24.55z"/>

                        <path fill="#FBBC05"
                        d="M10.6 28.54A14.44 14.44 0 0 1 9.5 24c0-1.58.27-3.11.75-4.54l-8.04-6.24A24.01 24.01 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l8.04-6.24z"/>

                        <path fill="#34A853"
                        d="M24 48c6.48 0 11.92-2.14 15.89-5.82l-7.26-5.64c-2.02 1.36-4.61 2.17-8.63 2.17-6.26 0-11.54-3.99-13.4-9.46l-8.04 6.24C6.51 42.62 14.62 48 24 48z"/>

                    </svg>

                    Continue with Google

                </button>

            </div>

            <p class="coming-soon">
                Google Sign-In is not available yet.
            </p>

        </div>

    </div>

</main>

<footer>

    <div class="container footer-content">

        <div>
            <h3>Digital Evidence Binder</h3>
            <p>Private Documentation Archive</p>
        </div>

        <div>
            <p>Maintained by Abdul Moeez</p>
            <p>For documentation purposes.</p>
        </div>

    </div>

</footer>

</body>
</html>
